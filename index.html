<!DOCTYPE html>
<html>
<head>
    <title>URL Shortener</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>
<body>

<div class="container">
    <h1>🔗 URL Shortener</h1>

    <form method="POST">
        <input
            type="text"
            name="url"
            placeholder="Paste your long URL here..."
            required>

        <button type="submit">
            Shorten URL
        </button>
    </form>

    {% if short_url %}
        <a href="{{ short_url }}" target="_blank">{{ short_url }}</a>
    {% endif %}
</div>
</body>
</html>
